<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyector de Evaluación</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for specific projector needs */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        #display-view {
            font-family: 'Inter', sans-serif;
            /* Dark sleek background for projector to avoid blinding light */
            background-color: #0f172a; 
            color: #f8fafc;
        }

        .timer-font {
            /* Monospace font for the timer so numbers don't jump around */
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .instruction-list {
            list-style-type: decimal;
            padding-left: 1.5rem;
        }

        .instruction-list li {
            margin-bottom: 0.75rem;
        }

        /* Smooth transition for progress bar */
        #progress-bar {
            transition: width 1s linear, background-color 0.5s ease;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-slate-800">

    <!-- ================= CONFIGURATION VIEW ================= -->
    <div id="config-view" class="h-full w-full flex items-center justify-center p-6 bg-slate-100 overflow-y-auto">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl">
            <h1 class="text-3xl font-bold text-slate-800 mb-6 text-center border-b pb-4">⚙️ Configurar Evaluación</h1>
            
            <form id="config-form" class="space-y-6">
                <!-- Exam Title -->
                <div>
                    <label for="exam-title" class="block text-sm font-semibold text-slate-700 mb-1">Título de la Evaluación</label>
                    <input type="text" id="exam-title" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" value="Evaluación de Matemática" required>
                </div>

                <!-- Timer Mode Selection -->
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <label class="block text-sm font-semibold text-slate-700 mb-3">Modo de Tiempo</label>
                    <div class="flex flex-col sm:flex-row gap-4 mb-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="time-mode" value="duration" class="w-4 h-4 text-blue-600" checked onchange="toggleTimeMode()">
                            <span>Duración (minutos)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="time-mode" value="endtime" class="w-4 h-4 text-blue-600" onchange="toggleTimeMode()">
                            <span>Hora de Término (HH:MM)</span>
                        </label>
                    </div>

                    <!-- Input for Duration -->
                    <div id="duration-input-group">
                        <label for="duration-mins" class="block text-sm text-slate-600 mb-1">Minutos de duración</label>
                        <input type="number" id="duration-mins" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: 90" min="1" value="90">
                    </div>

                    <!-- Input for End Time (Hidden by default) -->
                    <div id="endtime-input-group" class="hidden">
                        <label for="end-time-val" class="block text-sm text-slate-600 mb-1">Hora exacta de término</label>
                        <input type="time" id="end-time-val" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <p id="time-error" class="text-red-500 text-sm mt-2 hidden">La hora de término debe ser mayor a la hora actual.</p>
                </div>

                <!-- Instructions -->
                <div>
                    <label for="exam-instructions" class="block text-sm font-semibold text-slate-700 mb-1">Instrucciones (una por línea)</label>
                    <textarea id="exam-instructions" rows="4" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none">1. Mantén silencio durante la evaluación.
2. Si tienes dudas, levanta la mano y el profesor acudirá a tu puesto.
3. Todas las preguntas deben incluir su desarrollo paso a paso; de lo contrario, la respuesta no será considerada válida.</textarea>
                    <p class="text-xs text-slate-500 mt-1">Cada salto de línea será un punto en la lista.</p>
                </div>

                <!-- Start Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg flex justify-center items-center gap-2 text-lg">
                    <span>▶ Iniciar Proyección</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ================= DISPLAY VIEW (PROJECTOR) ================= -->
    <div id="display-view" class="h-full w-full flex flex-col hidden relative">
        
        <!-- Top Bar: Title -->
        <div class="px-8 py-6 bg-slate-900 border-b border-slate-700 shadow-md flex justify-between items-center z-10">
            <h1 id="display-title" class="text-4xl md:text-5xl font-bold tracking-tight text-white shadow-sm">Evaluación</h1>
            
            <!-- Subtle Reset Button -->
            <button onclick="resetExam()" class="text-slate-500 hover:text-white transition px-3 py-1 rounded border border-slate-700 hover:border-slate-500 text-sm" title="Finalizar o configurar de nuevo">
                Terminar
            </button>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow flex flex-col lg:flex-row overflow-hidden">
            
            <!-- Timer Area -->
            <div class="flex-grow flex flex-col items-center justify-center p-8 border-b lg:border-b-0 lg:border-r border-slate-800 relative bg-slate-900 shadow-inner">
                <div class="text-slate-400 text-xl md:text-2xl mb-4 font-semibold uppercase tracking-widest text-center" id="timer-label">Tiempo Restante</div>
                
                <!-- The Huge Timer -->
                <div id="countdown-timer" class="timer-font text-[6rem] sm:text-[8rem] md:text-[12rem] lg:text-[15rem] leading-none font-bold text-white transition-colors duration-500 text-center drop-shadow-2xl">
                    00:00
                </div>
                
                <div id="time-up-msg" class="hidden text-5xl md:text-7xl font-bold text-red-500 mt-8 animate-pulse text-center drop-shadow-lg">
                    ¡TIEMPO TERMINADO!
                </div>
            </div>

            <!-- Instructions Area -->
            <div class="w-full lg:w-1/3 min-w-[350px] p-8 lg:p-12 bg-slate-800 flex flex-col overflow-y-auto">
                <div class="flex items-center gap-3 mb-6 border-b border-slate-600 pb-4">
                    <span class="text-3xl">📋</span>
                    <h2 class="text-3xl font-bold text-blue-300">Instrucciones</h2>
                </div>
                <div id="display-instructions" class="text-slate-200 text-xl md:text-2xl leading-relaxed space-y-4">
                    <!-- Instructions injected here -->
                </div>
                
                <!-- Little encouragement at the bottom -->
                <div class="mt-auto pt-12 text-center">
                    <p class="text-2xl font-bold text-slate-500 opacity-50">¡Mucho éxito!</p>
                </div>
            </div>
        </div>

        <!-- Progress Bar (Bottom) -->
        <div class="h-4 w-full bg-slate-900 relative">
            <div id="progress-bar" class="h-full bg-blue-500 w-full rounded-r-sm"></div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // State variables
        let timerInterval = null;
        let endTimeMs = 0;
        let totalDurationMs = 0;

        // UI Elements
        const configView = document.getElementById('config-view');
        const displayView = document.getElementById('display-view');
        const configForm = document.getElementById('config-form');
        
        // Display Elements
        const displayTitle = document.getElementById('display-title');
        const countdownTimer = document.getElementById('countdown-timer');
        const displayInstructions = document.getElementById('display-instructions');
        const progressBar = document.getElementById('progress-bar');
        const timeUpMsg = document.getElementById('time-up-msg');
        const timerLabel = document.getElementById('timer-label');
        const errorMsg = document.getElementById('time-error');

        // Toggle input fields based on Radio selection
        function toggleTimeMode() {
            const mode = document.querySelector('input[name="time-mode"]:checked').value;
            if (mode === 'duration') {
                document.getElementById('duration-input-group').classList.remove('hidden');
                document.getElementById('endtime-input-group').classList.add('hidden');
            } else {
                document.getElementById('duration-input-group').classList.add('hidden');
                document.getElementById('endtime-input-group').classList.remove('hidden');
            }
            errorMsg.classList.add('hidden');
        }

        // Form Submit Handler
        configForm.addEventListener('submit', function(e) {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            const title = document.getElementById('exam-title').value;
            const mode = document.querySelector('input[name="time-mode"]:checked').value;
            const instructionsText = document.getElementById('exam-instructions').value;

            // Calculate End Time
            let now = new Date();
            
            if (mode === 'duration') {
                const mins = parseInt(document.getElementById('duration-mins').value);
                if (isNaN(mins) || mins <= 0) return;
                totalDurationMs = mins * 60 * 1000;
                endTimeMs = now.getTime() + totalDurationMs;
            } else {
                const endVal = document.getElementById('end-time-val').value;
                if (!endVal) return;
                
                const [hours, minutes] = endVal.split(':');
                let endDate = new Date(now);
                endDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                
                // If time has already passed today, show error
                if (endDate.getTime() <= now.getTime()) {
                    errorMsg.classList.remove('hidden');
                    return;
                }
                
                endTimeMs = endDate.getTime();
                totalDurationMs = endTimeMs - now.getTime();
            }

            // Setup Display Data
            displayTitle.textContent = title;
            
            // Format instructions into a nice HTML list
            const instructionsLines = instructionsText.split('\n').filter(line => line.trim() !== '');
            displayInstructions.innerHTML = '';
            
            if(instructionsLines.length > 0) {
                const ul = document.createElement('ul');
                ul.className = 'instruction-list space-y-4';
                instructionsLines.forEach(line => {
                    // Remove leading numbers if user typed them (e.g. "1. ") so CSS can handle it cleanly
                    let cleanLine = line.replace(/^\d+[\.\-]?\s*/, '');
                    const li = document.createElement('li');
                    li.textContent = cleanLine;
                    ul.appendChild(li);
                });
                displayInstructions.appendChild(ul);
            } else {
                displayInstructions.innerHTML = '<p class="text-slate-500 italic">No hay instrucciones adicionales.</p>';
            }

            // Reset UI states
            countdownTimer.classList.remove('hidden', 'text-yellow-400', 'text-red-500');
            countdownTimer.classList.add('text-white');
            timeUpMsg.classList.add('hidden');
            timerLabel.classList.remove('hidden');
            
            // Switch Views
            configView.classList.add('hidden');
            displayView.classList.remove('hidden');

            // Start Timer
            startTimer();
        });

        function startTimer() {
            // Clear any existing interval
            if (timerInterval) clearInterval(timerInterval);
            
            // Initial call
            updateTimerDisplay();
            
            // Set interval
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function updateTimerDisplay() {
            const now = new Date().getTime();
            const remainingMs = endTimeMs - now;

            if (remainingMs <= 0) {
                // Time is up!
                clearInterval(timerInterval);
                countdownTimer.textContent = "00:00";
                progressBar.style.width = "0%";
                progressBar.classList.remove('bg-blue-500', 'bg-yellow-400');
                progressBar.classList.add('bg-red-600');
                
                // Visual alerts
                countdownTimer.classList.add('hidden');
                timerLabel.classList.add('hidden');
                timeUpMsg.classList.remove('hidden');
                return;
            }

            // Calculate hours, mins, secs
            const h = Math.floor(remainingMs / (1000 * 60 * 60));
            const m = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((remainingMs % (1000 * 60)) / 1000);

            // Format string
            let timeString = "";
            if (h > 0) {
                timeString += h.toString().padStart(2, '0') + ":";
            }
            timeString += m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
            countdownTimer.textContent = timeString;

            // Update Progress Bar
            const percentRemaining = (remainingMs / totalDurationMs) * 100;
            progressBar.style.width = `${Math.max(0, percentRemaining)}%`;

            // Color Warnings
            const remainingMinsTotal = remainingMs / (1000 * 60);
            
            // Reset colors first
            countdownTimer.classList.remove('text-white', 'text-yellow-400', 'text-red-500');
            progressBar.classList.remove('bg-blue-500', 'bg-yellow-400', 'bg-red-500');

            if (remainingMinsTotal <= 1) {
                // Danger (Red) - 1 minute or less
                countdownTimer.classList.add('text-red-500');
                progressBar.classList.add('bg-red-500');
            } else if (remainingMinsTotal <= 5) {
                // Warning (Yellow) - 5 minutes or less
                countdownTimer.classList.add('text-yellow-400');
                progressBar.classList.add('bg-yellow-400');
            } else {
                // Normal (White/Blue)
                countdownTimer.classList.add('text-white');
                progressBar.classList.add('bg-blue-500');
            }
        }

        // Return to configuration
        function resetExam() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            displayView.classList.add('hidden');
            configView.classList.remove('hidden');
            
            // Reset progress bar visually
            progressBar.style.width = "100%";
            progressBar.classList.remove('bg-yellow-400', 'bg-red-500', 'bg-red-600');
            progressBar.classList.add('bg-blue-500');
        }

        // Initialize setup
        toggleTimeMode(); // Ensure correct input is showing on load

    </script>
</body>
</html>
